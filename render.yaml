# Fair Delivery 1.3 pilot on the existing Render service.
# Connects to the already provisioned PostgreSQL without exposing credentials.
services:
  - type: web
    name: fair-delivery
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/dexter18453-cyber/fair-delivery
    branch: fix/fair-delivery-pilot-1-3
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_EMPTY_PRODUCTION_STATE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: fair-delivery-pilot-db
          property: connectionString
