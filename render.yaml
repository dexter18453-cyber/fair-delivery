# Fair Delivery 1.3 single-store pilot on the existing Render service.
# Existing PostgreSQL connection is injected by Render (no credentials committed).
services:
  - type: web
    name: fair-delivery
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/dexter18453-cyber/fair-delivery
    branch: fix/fair-delivery-pilot-1-3
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_EMPTY_PRODUCTION_STATE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fair-delivery-pilot-db
          property: connectionString
