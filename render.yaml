# Fair Delivery: current existing Render service, free web plan.
# The live DATABASE_URL is set privately on the Render service.
# Do not automatically bind the 30-day expiring Render Free PostgreSQL again.
# On a new Blueprint installation, DATABASE_URL must be provided explicitly
# by the owner after verifying a durable, properly migrated Postgres destination.
# Do not set ALLOW_EMPTY_PRODUCTION_STATE=true to bypass an empty database.
services:
  - type: web
    name: fair-delivery
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/dexter18453-cyber/fair-delivery
    branch: fix/fair-delivery-pilot-1-3
    buildCommand: npm ci && env -u DATABASE_URL -u RENDER NODE_ENV=test npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_EMPTY_PRODUCTION_STATE
        value: "false"
      - key: DATABASE_URL
        sync: false
