    <script src="https://unpkg.com"></script>
    <script>
        let isOnline = false, checkInterval, map, riderMarker;
        let shopLat = 37.966, shopLng = 23.645;
        let riderLat = 37.960, riderLng = 23.638;

        function toggleStatus() {
            isOnline = !isOnline;
            const btn = document.getElementById('toggleBtn');
            const txt = document.getElementById('statusText');
            if(isOnline) {
                btn.innerText = "GO OFFLINE"; btn.classList.add('online');
                txt.innerText = "Αναμονή για σήμα...";
                startCheckingServer();
            } else {
                btn.innerText = "GO ONLINE"; btn.classList.remove('online');
                txt.innerText = "Είστε Offline.";
                clearInterval(checkInterval);
                document.getElementById('orderCard').style.display = 'none';
                document.getElementById('map').style.display = 'none';
            }
        }

        function startCheckingServer() {
            checkInterval = setInterval(() => {
                // ΑΛΛΑΓΗ: Ακούει LIVE το Render
                fetch('https://onrender.com')
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'Αναζήτηση Rider') {
                        document.getElementById('toggleBtn').style.display = 'none';
                        document.getElementById('statusText').style.display = 'none';
                        document.getElementById('orderCard').style.display = 'block';
                        initMap();
                    }
                });
            }, 1500);
        }

        function initMap() {
            document.getElementById('map').style.display = 'block';
            if (!map) {
                map = L.map('map').setView([shopLat, shopLng], 14);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                L.marker([shopLat, shopLng]).addTo(map).bindPopup('Ο Στέλιος').openPopup();
                riderMarker = L.marker([riderLat, riderLng]).addTo(map).bindPopup('Εσείς');
            }
            map.invalidateSize();
        }

        function acceptOrder() {
            // ΑΛΛΑΓΗ: Στέλνει LIVE στο Render
            fetch('https://onrender.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'Σε εξέλιξη' })
            }).then(() => {
                const btn = document.getElementById('actionBtn');
                btn.innerText = "ΠΑΡΑΔΟΘΗΚΕ";
                btn.style.backgroundColor = "#00e676";
                btn.setAttribute("onclick", "completeOrder()");
                simulateRiderMovement();
            });
        }

        function simulateRiderMovement() {
            let steps = 0;
            let moveInterval = setInterval(() => {
                steps++;
                riderLat += (shopLat - riderLat) * 0.25;
                riderLng += (shopLng - riderLng) * 0.25;
                riderMarker.setLatLng([riderLat, riderLng]);
                
                // ΑΛΛΑΓΗ: Στέλνει LIVE σήμα τοποθεσίας στο Render
                fetch('https://onrender.com', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'Σε εξέλιξη', lat: riderLat, lng: riderLng })
                });

                if(steps >= 12) {
                    clearInterval(moveInterval);
                }
            }, 1200);
        }

        function completeOrder() {
            // ΑΛΛΑΓΗ: Στέλνει LIVE στο Render
            fetch('https://onrender.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'Παραδόθηκε' })
            }).then(() => {
                alert("Ολοκληρώθηκε!");
                location.reload();
            });
        }
    </script>
