<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Fair Delivery - Merchant App</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background-color: #050b11; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .tablet-container { width: 800px; height: 500px; background-color: #0c1622; border: 12px solid #1e293b; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .shop-header { background-color: #111d27; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
        .shop-header h2 { margin: 0; font-size: 20px; color: #00e676; }
        .main-content { flex: 1; display: flex; overflow: hidden; }
        .orders-sidebar { width: 300px; background-color: #09121c; border-right: 1px solid #1e293b; padding: 15px; }
        .order-item { background-color: #111d27; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; }
        .order-details-panel { flex: 1; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; }
        .items-list { flex: 1; font-size: 16px; }
        .action-zone { display: flex; gap: 15px; }
        .btn-action { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; background-color: #00f2fe; color: #050b11; }
    </style>
</head>
<body>
    <div class="tablet-container">
        <div class="shop-header">
            <h2><i class="fa-solid fa-store"></i> Ο Στέλιος (Merchant Panel)</h2>
            <div style="color: #00e676; font-weight: bold;">ΑΝΟΙΧΤΟ</div>
        </div>
        <div class="main-content">
            <div class="orders-sidebar">
                <div class="order-item">
                    <div style="display:flex; justify-content:space-between; font-weight:bold;"><span>#1042 - Πελάτης</span><span>8.50€</span></div>
                    <div id="sidebarStatus" style="font-size:12px; color:#94a3b8; margin-top:5px;">Αναμονή...</div>
                </div>
            </div>
            <div class="order-details-panel">
                <div class="items-list">
                    <h3>Παραγγελία #1042</h3>
                    <p style="color:#94a3b8;">1x Σουβλάκι με το Μέτρο Χοιρινό</p>
                </div>
                <div class="action-zone">
                    <button class="btn-action" id="btnAction" onclick="updateOrder('Αναζήτηση Rider')">ΑΠΟΔΟΧΗ & ΚΛΗΣΗ ΔΙΑΝΟΜΕΑ</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        let audio = new Audio('https://mixkit.co');
        
        setInterval(() => {
            fetch('http://localhost:3000/api/order')
            .then(res => res.json())
            .then(data => {
                document.getElementById('sidebarStatus').innerText = data.status;
                if(data.status === 'Νέα Παραγγελία') {
                    document.getElementById('btnAction').innerText = "ΑΠΟΔΟΧΗ & ΚΛΗΣΗ ΔΙΑΝΟΜΕΑ";
                    document.getElementById('btnAction').disabled = false;
                    audio.play().catch(()=>{});
                } else if(data.status === 'Αναζήτηση Rider') {
                    document.getElementById('btnAction').innerText = "ΑΝΑΖΗΤΗΣΗ RIDER...";
                    document.getElementById('btnAction').disabled = true;
                } else if(data.status === 'Σε εξέλιξη') {
                    document.getElementById('btnAction').innerText = "Ο RIDER ΕΡΧΕΤΑΙ";
                    document.getElementById('btnAction').disabled = true;
                } else if(data.status === 'Παραδόθηκε') {
                    document.getElementById('btnAction').innerText = "ΠΑΡΑΔΟΘΗΚΕ ✔";
                    document.getElementById('btnAction').disabled = true;
                }
            });
        }, 1500);

        function updateOrder(newStatus) {
            fetch('http://localhost:3000/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
        }
    </script>
</body>
</html>
