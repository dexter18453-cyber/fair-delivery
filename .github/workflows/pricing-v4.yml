name: Fair Delivery pricing v4 verification
on:
  push:
    branches: [feature/live-pricing-230-8pct-20261123]
  pull_request:
    paths: [server.js, billing-pricing.js, financial-report.js, shop-billing.js, smoke-test.js, "tests/**", "public/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
