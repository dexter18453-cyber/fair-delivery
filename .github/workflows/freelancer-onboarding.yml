name: Freelancer onboarding regression
on:
  push:
    branches:
      - feature/freelancer-onboarding-1-5
      - fix/fair-delivery-pilot-1-3
  pull_request:
    branches:
      - fix/fair-delivery-pilot-1-3
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: env -u DATABASE_URL -u RENDER NODE_ENV=test npm test
